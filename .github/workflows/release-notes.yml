name: Sync Release Notes

# 用途：修改 .github/release-notes/<tag>.md 并 push 后，
# 自动把内容同步到对应的 GitHub Release 正文。
# 不改动 tag、不重新构建、不重新上传资产。
#
# 背景：本地 fine-grained PAT 只有 Contents 写权限，
# `gh release edit` 和 `gh workflow run` 都会 403，
# 只能借 CI 的 GITHUB_TOKEN（contents:write）来改 Release。
#
# 用法：编辑 .github/release-notes/v1.3.7.md 后提交推送即可。

on:
  push:
    branches: [ main ]
    paths:
      - '.github/release-notes/*.md'

  # 也保留手动入口（在网页 Actions 页面点 Run workflow）
  workflow_dispatch:
    inputs:
      tag:
        description: '要更新说明的 tag（如 v1.3.7；留空则同步全部）'
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 找出本次变更的说明文件
        id: changed
        run: |
          MANUAL="${{ inputs.tag }}"
          if [ -n "$MANUAL" ]; then
            echo "files=.github/release-notes/${MANUAL}.md" >> "$GITHUB_OUTPUT"
            echo "手动指定: $MANUAL"
          else
            FILES=$(git diff --name-only HEAD^ HEAD -- '.github/release-notes/*.md' || true)
            echo "files<<__EOF__" >> "$GITHUB_OUTPUT"
            echo "$FILES" >> "$GITHUB_OUTPUT"
            echo "__EOF__" >> "$GITHUB_OUTPUT"
            echo "变更文件:"
            echo "$FILES"
          fi

      - name: 同步到对应 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ANY=0
          for f in ${{ steps.changed.outputs.files }}; do
            [ -f "$f" ] || continue
            TAG=$(basename "$f" .md)
            ANY=1
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --notes-file "$f"
              echo "✅ 已更新 $TAG 的 Release 正文"
            else
              echo "⏭ $TAG 尚无 Release，跳过（等 tag 构建时自动使用该说明）"
            fi
          done
          if [ "$ANY" = "0" ]; then echo "没有需要同步的文件"; fi
