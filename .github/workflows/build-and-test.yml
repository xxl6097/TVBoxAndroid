name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug -x lint --no-daemon
        env:
          GRADLE_OPTS: -Xmx3g

      - name: Build Release APK (signed with debug key)
        run: |
          ./gradlew assembleRelease -x lint --no-daemon \
            -PKEYSTORE_PATH=debug.keystore \
            -PKEYSTORE_PASSWORD=android \
            -PKEY_ALIAS=androiddebugkey \
            -PKEY_PASSWORD=android
        env:
          GRADLE_OPTS: -Xmx3g

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Rename APKs
        run: |
          V=${{ steps.version.outputs.version }}
          # debug
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/TVBoxAndroid-v${V}-debug.apk 2>/dev/null || true
          # release
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/TVBoxAndroid-v${V}-release.apk 2>/dev/null || true
          echo "=== Output files ==="
          ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxAndroid-debug
          path: app/build/outputs/apk/debug/TVBoxAndroid-*.apk
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxAndroid-release
          path: app/build/outputs/apk/release/TVBoxAndroid-*.apk
          retention-days: 30

      # 打 tag 时自动发布 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "夜帧影视 ${{ github.ref_name }}"
          body: |
            ## 夜帧影视 ${{ github.ref_name }}
            
            版本: ${{ steps.version.outputs.version }}
            构建时间: ${{ github.event.repository.updated_at }}
            提交: ${{ github.sha }}
            
            ### 安装方法
            - 下载 `TVBoxAndroid-*-release.apk`（正式包，已签名可直接安装）
            - 下载 `TVBoxAndroid-*-debug.apk`（调试包，方便开发调试）
            
            ### 应用内更新
            打开应用 → 设置 → 关于 → 检查更新
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/TVBoxAndroid-*-release.apk
            app/build/outputs/apk/debug/TVBoxAndroid-*-debug.apk
