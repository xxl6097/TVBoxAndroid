name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许创建 GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle   # 自动缓存 ~/.gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug -x lint --no-daemon
        env:
          GRADLE_OPTS: -Xmx3g

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease -x lint --no-daemon \
            -PKEYSTORE_PATH=$GITHUB_WORKSPACE/debug.keystore \
            -PKEYSTORE_PASSWORD=android \
            -PKEY_ALIAS=androiddebugkey \
            -PKEY_PASSWORD=android
        env:
          GRADLE_OPTS: -Xmx3g

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Rename APKs
        run: |
          V=${{ steps.version.outputs.version }}
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/TVBoxAndroid-v${V}-debug.apk 2>/dev/null || true
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/TVBoxAndroid-v${V}-release.apk 2>/dev/null || true
          echo "=== Output files ==="
          ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxAndroid-debug
          path: app/build/outputs/apk/debug/TVBoxAndroid-*.apk
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxAndroid-release
          path: app/build/outputs/apk/release/TVBoxAndroid-*.apk
          retention-days: 30

      # 生成 Release 正文：
      #   1. 优先读 .github/release-notes/<tag>.md —— 手写的版本说明，内容丰富
      #   2. 没有则退回「上一个 tag 到本 tag 的提交列表」，至少能看到改了什么
      - name: Generate release body
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE=".github/release-notes/${TAG}.md"
          {
            echo "body<<__NOTES_EOF__"
            if [ -f "$FILE" ]; then
              echo "<!-- 来源: $FILE -->"
              cat "$FILE"
            else
              echo "## 夜帧影视 ${TAG}"
              echo ""
              echo "**版本**: ${{ steps.version.outputs.version }}"
              echo "**提交**: ${GITHUB_SHA}"
              echo ""
              echo "### 本版变更"
              echo ""
              PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
              if [ -n "$PREV" ]; then
                echo '```'
                git log --pretty=format:'- %s' "${PREV}..${TAG}" 2>/dev/null || true
                echo '```'
              else
                echo "- 无历史 tag 可比对"
              fi
              echo ""
              echo "### 安装方法"
              echo "下载 \`TVBoxAndroid-*-release.apk\`（已签名，可直接安装）"
              echo ""
              echo "### 应用内更新"
              echo "设置 → 关于 → 检查更新"
            fi
            echo "__NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Release body 来源: ${FILE}"

      # tag 推送时自动创建 GitHub Release 并上传 APK
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "夜帧影视 ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
          # 已存在同名 Release 时覆盖更新正文与资产，而不是静默跳过
          overwrite_files: true
          files: |
            app/build/outputs/apk/release/TVBoxAndroid-*-release.apk
            app/build/outputs/apk/debug/TVBoxAndroid-*-debug.apk
