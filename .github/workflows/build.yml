name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxAndroid-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # 额外跑一次 release（未签名）只为验证 R8/ProGuard 规则没把东西裁坏，
      # 没有密钥时不签名是正常的，产物仅供体积参考
      - name: Build Release (R8 check, unsigned)
        run: ./gradlew assembleRelease --no-daemon

      # 未签名 release 也上传，供本地用固定密钥签名后安装到真机
      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxAndroid-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

      - name: Show APK Info
        run: |
          echo "== debug =="
          ls -lh app/build/outputs/apk/debug/ || true
          echo "== release =="
          ls -lh app/build/outputs/apk/release/ || true
